name: Bug report
description: Something in TBOSS does not work as the manual says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. The more precise, the faster it gets fixed.
  - type: input
    id: version
    attributes:
      label: TBOSS version
      description: Settings → About on the board (e.g. 1.3.0 BETA), or the commit if you built it yourself.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Playing / pads, Chords and scales, Hold / strum / arpeggiator, Presets and settings, Settings menu / buttons, Display or lights, MIDI (channels, pressure, clock, MIDI in), Web editor, Browser installer, SWD flash tool, Building / tests, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Step by step, so someone else can repeat it.
      placeholder: "1. Settings → Arpeggiator → Arp → Up\n2. Hold the bottom-left chord pad\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Operating system and browser, DAW/synth, MIDI routing, SWD adapter (for SWD install problems).
  - type: textarea
    id: logs
    attributes:
      label: Messages or output
      description: What the display showed, the installer's Details box, or the tool's terminal output (please remove personal paths).
      render: text
