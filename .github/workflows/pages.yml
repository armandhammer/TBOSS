# The installer and editor on GitHub Pages, with the newest full release's firmware (not
# pre-releases: testers install those with the installer's "use a file") next to them,
# so people only need a link: https://armandhammer.github.io/TBOSS/install.html
# Runs when a release is published, when webapp/ changes on main, or by hand.
name: Web installer and editor
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ['webapp/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Site = webapp/ + the newest full release's theoryboard-usb.bin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site/firmware
          cp -r webapp/. site/
          # Give every script address this commit's version, so a new page never runs with an
          # older script the browser still has cached (Pages lets browsers cache for 10 minutes).
          v="${GITHUB_SHA:0:12}"
          sed -i -E "s#(\./tb-[a-z-]+\.js)'#\1?v=${v}'#g" site/*.html site/*.js
          grep -q "tb-protocol.js?v=${v}'" site/index.html
          grep -q "tb-protocol.js?v=${v}'" site/tb-midi.js
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)  # latest, not a pre-release
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern theoryboard-usb.bin --dir site/firmware
          mv site/firmware/theoryboard-usb.bin site/firmware/tboss.bin
          python3 - "$tag" <<'PY'
          import hashlib, json, sys
          data = open('site/firmware/tboss.bin', 'rb').read()
          manifest = {'version': sys.argv[1].lstrip('v'), 'file': 'tboss.bin',
                      'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}
          open('site/firmware/tboss.json', 'w').write(json.dumps(manifest) + '\n')
          print(manifest)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
