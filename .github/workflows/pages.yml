# The website on GitHub Pages: the project page, the manual (built from docs/manual.md), the
# installer and the editor, with the newest full release's firmware (not pre-releases: testers
# install those with the installer's "use a file") next to them, so people only need a link:
# https://armandhammer.github.io/TBOSS/ (the installer: install.html, the editor: editor.html).
# Runs when a release is published, when the site or the manual changes on main, or by hand.
name: Website, installer and editor
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ['webapp/**', 'docs/manual.md', 'docs/assets/**', 'scripts/build_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Site = the project page, the manual, webapp/ + the newest full release's theoryboard-usb.bin
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && !github.event.release.prerelease && github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail
          python3 scripts/build_site.py --out site
          mkdir -p site/firmware
          # Give every script and style address this commit's version, so a new page never runs with
          # an older script the browser still has cached (Pages lets browsers cache for 10 minutes).
          v="${GITHUB_SHA:0:12}"
          sed -i -E "s#(\./tb-[a-z-]+\.js)'#\1?v=${v}'#g" site/*.html site/*.js
          sed -i -E "s#(site/site\.(css|js))\"#\1?v=${v}\"#g" site/*.html
          grep -q "tb-protocol.js?v=${v}'" site/editor.html
          grep -q "tb-protocol.js?v=${v}'" site/tb-midi.js
          grep -q "site/site.css?v=${v}\"" site/manual.html
          # The release that triggered this run; otherwise the latest (not a pre-release). Asking for
          # the latest right after publishing can still return the previous one.
          tag="${RELEASE_TAG:-}"
          [ -n "$tag" ] || tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern theoryboard-usb.bin --dir site/firmware
          mv site/firmware/theoryboard-usb.bin site/firmware/tboss.bin
          python3 - "$tag" <<'PY'
          import hashlib, json, sys
          data = open('site/firmware/tboss.bin', 'rb').read()
          manifest = {'version': sys.argv[1].lstrip('v'), 'file': 'tboss.bin',
                      'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}
          open('site/firmware/tboss.json', 'w').write(json.dumps(manifest) + '\n')
          print(manifest)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
